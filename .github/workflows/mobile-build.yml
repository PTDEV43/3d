name: Mobile builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/mobile-build.yml"

permissions:
  contents: read

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies and build web app
        run: |
          npm install
          npm run build
      - name: Generate Android native project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pt-fighting-studio-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and build web app
        run: |
          npm install
          npm run build
      - name: Generate iOS native project
        run: npx cap add ios
      - name: Sync Capacitor
        run: npx cap sync ios
      - name: Build iOS Simulator app
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO
      - name: Package simulator app
        run: |
          cd build/ios/Build/Products/Debug-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/pt-fighting-studio-ios-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: pt-fighting-studio-ios-simulator
          path: pt-fighting-studio-ios-simulator.zip
          if-no-files-found: error
